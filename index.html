    <script>
      (function() {
        try {
          var stored = localStorage.getItem("ssr-theme");
          var supportDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (!stored && supportDark)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }

          var storedWeather = localStorage.getItem("ssr-weather");
          if (storedWeather === "sunny" || storedWeather === "cloudy" || storedWeather === "rain") {
            document.documentElement.setAttribute("data-weather", storedWeather);
          } else {
            document.documentElement.setAttribute("data-weather", "sunny");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

  </body>
